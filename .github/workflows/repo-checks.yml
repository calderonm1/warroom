name: repo-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch main for contract breaking checks
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install tooling
        run: make setup
      - name: Lint tooling
        run: make lint
      - name: Test tooling
        run: make test-tools
      - name: Docs check
        run: make docs-check
      - name: Backlog validate
        run: make backlog-validate
      - name: Backlog index is fresh
        run: make backlog-index-check
      - name: Environment manifests
        run: make ops-validate
      - name: Install buf
        run: |
          curl -fsSL -o /tmp/buf.tar.gz "https://github.com/bufbuild/buf/releases/download/v1.74.0/buf-Linux-x86_64.tar.gz"
          echo "cc482285b2c388c93f8bed0a972330695c1c8dd121d5ece460d25ceed93f21ac  /tmp/buf.tar.gz" | sha256sum -c -
          tar -xzf /tmp/buf.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 /tmp/buf/bin/buf "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/buf" --version
      - name: Contract lint
        run: make contracts-lint
      - name: Ready stories (summary)
        if: always()
        run: |
          {
            echo "## Ready stories"
            echo '```'
            uv run --frozen wr backlog next --limit 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
