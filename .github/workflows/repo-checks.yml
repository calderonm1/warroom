name: repo-checks

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
      - name: Setup uv
        uses: ./.github/actions/setup-uv
      - name: Install tooling
        run: make setup
      - name: Lint tooling
        run: make lint
      - name: Test tooling
        run: make test-tools
      - name: Docs check
        run: make docs-check
      - name: Backlog validate
        run: make backlog-validate
      - name: Backlog index is fresh
        run: make backlog-index-check
      - name: Environment manifests
        run: make ops-validate
      - name: Workflow conventions
        run: make ci-check
      - name: Ready stories (summary)
        if: always()
        run: |
          {
            echo "## Ready stories"
            echo '```'
            uv run --frozen wr backlog next --limit 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
