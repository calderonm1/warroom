name: Setup buf
description: Install the buf CLI version pinned in .tool-versions. Lint and breaking checks belong to later workflows.

runs:
  using: composite
  steps:
    - name: Read buf pin
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        version="$(awk '$1 == "buf" { print $2; exit }' .tool-versions)"
        if [ -z "${version}" ]; then
          echo ".tool-versions has no buf pin" >&2
          exit 1
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - name: Install buf
      uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
      with:
        version: ${{ steps.pin.outputs.version }}
        setup_only: true
        lint: false
        format: false
        breaking: false
        push: false
        archive: false
