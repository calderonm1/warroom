[project]
name = "warroom-tools"
version = "0.1.0"
description = "Repository tooling for War Room: backlog, docs and environment manifest checks, GitHub Projects sync."
readme = "tools/README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
]

[project.scripts]
wr = "warroom_tools.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/warroom_tools"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["tools"]
extend-exclude = ["client", "server", "shared", "infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
