id: EP-12
title: Economy, buildings and production
milestone: M2
priority: P0
summary: >
  Resources, hourly production and upkeep, storage caps, morale, buildings and construction, unit
  production queues and mobilization, all data-driven and fair by design.
docs: [docs/02-game-design/economy.md]
refs: [GDD-ECON-001, ADR-0010]
labels: [gameplay, sim]
features:
  - id: FE-12.1
    title: Resources and upkeep
    summary: Production, upkeep, storage and morale on the economy tick.
    stories:
      - id: ST-12.1.1
        title: Resource production on the economy tick
        type: feature
        status: draft
        priority: P0
        size: M
        story: >
          As a player, I want my provinces to produce resources every game hour, so that my economy grows with my
          territory.
        acceptance_criteria:
          - Output follows the GDD formula with modifiers from content; core versus occupied output differs per GDD-MAP-007.
          - Golden replay covers a 7-day economy-only match.
        docs: [docs/02-game-design/economy.md]
        refs: [GDD-ECON-001, GDD-MAP-007]
        depends_on: [ST-05.4.1]
      - id: ST-12.1.2
        title: Upkeep, deficits and storage caps
        type: feature
        status: draft
        priority: P0
        size: S
        story: >
          As a player, I want armies to cost upkeep and resources to cap, so that I must balance my military and
          economy.
        acceptance_criteria:
          - Upkeep per tick and deficit penalties per GDD-ECON-002; storage caps per GDD-ECON-003.
        docs: [docs/02-game-design/economy.md]
        refs: [GDD-ECON-002, GDD-ECON-003]
        depends_on: [ST-12.1.1]
      - id: ST-12.1.3
        title: Province morale
        type: feature
        status: draft
        priority: P1
        size: S
        story: >
          As a player, I want morale to reflect war weariness and distance, so that overextension has a cost.
        acceptance_criteria:
          - Morale drifts toward its target each tick per GDD-ECON-004 and scales output.
        docs: [docs/02-game-design/economy.md]
        refs: [GDD-ECON-004]
        depends_on: [ST-12.1.1]
  - id: FE-12.2
    title: Buildings and production queues
    summary: Construction, unit production and mobilization.
    stories:
      - id: ST-12.2.1
        title: Building construction and levels
        type: feature
        status: draft
        priority: P0
        size: M
        story: >
          As a player, I want to construct and upgrade buildings in my provinces, so that I can specialize my economy.
        acceptance_criteria:
          - Construct and upgrade commands respect slots, costs and times from content; queues support the default length.
        docs: [docs/02-game-design/economy.md, docs/02-game-design/core-loop.md]
        refs: [GDD-LOOP-002, GDD-MAP-002]
        depends_on: [ST-12.1.1]
      - id: ST-12.2.2
        title: Unit production queues
        type: feature
        status: draft
        priority: P0
        size: M
        story: >
          As a player, I want to queue units in provinces with the right buildings, so that my army grows while I am
          away.
        acceptance_criteria:
          - Cost is reserved at queue time; cancel refunds 75%; no paid instant-completes in ranked.
        docs: [docs/02-game-design/economy.md]
        refs: [GDD-ECON-010, GDD-ECON-011, GDD-LOOP-002]
        depends_on: [ST-12.2.1]
      - id: ST-12.2.3
        title: Mobilization
        type: feature
        status: draft
        priority: P2
        size: S
        story: >
          As a player, I want to declare mobilization, so that I can trade economy for manpower in a crisis.
        acceptance_criteria:
          - Mobilization modifiers per GDD-ECON-012.
        docs: [docs/02-game-design/economy.md]
        refs: [GDD-ECON-012]
        depends_on: [ST-12.1.1]
  - id: FE-12.3
    title: Economy UI
    summary: Province sheet and queue screens.
    stories:
      - id: ST-12.3.1
        title: Province sheet and production queue screens
        type: feature
        status: draft
        priority: P0
        size: M
        story: >
          As a player, I want to see a province's output, buildings and queues and manage them, so that I can run my
          economy on a phone.
        acceptance_criteria:
          - SCR-007 and SCR-009 implemented with loading, empty and error states.
        docs: [docs/04-ux/hud-and-screens.md]
        refs: [SCR-007, SCR-009]
        depends_on: [ST-12.2.2, ST-11.2.1]
