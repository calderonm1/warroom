id: EP-05
title: Shared deterministic simulation
milestone: M1
priority: P0
summary: >
  The WarRoom.Simulation library: fixed-point math, deterministic RNG, match state, command pipeline,
  event scheduler, movement, ticks and the replay-based test harness. It runs unchanged on the server
  (authority) and in Unity (prediction and previews).
outcome: >
  The same command log produces the same state hash on .NET server builds and Unity IL2CPP builds,
  verified in CI by golden replays.
docs: [docs/03-architecture/simulation.md, docs/adr/0005-shared-deterministic-simulation.md]
refs: [ADR-0005, SIM-001, SIM-002, RISK-002]
labels: [sim]
features:
  - id: FE-05.1
    title: Deterministic foundations
    summary: Project setup, fixed-point math, RNG, sphere math and analyzers that ban nondeterminism.
    stories:
      - id: ST-05.1.1
        title: Simulation and test projects with make sim-test
        type: chore
        status: ready
        priority: P0
        size: S
        story: >
          As a simulation developer, I want the shared library and its tests set up with the right target and
          language version, so that it compiles for both Unity and the server.
        acceptance_criteria:
          - shared/simulation/WarRoom.Simulation targets netstandard2.1 with LangVersion 9 and no package dependencies beyond the allowed list.
          - A test project on net10.0 references it; `make sim-test` runs tests in under 30 seconds on an empty suite.
          - The Unity client consumes the assembly (source or DLL) as documented in client-architecture.md.
        docs: [docs/03-architecture/simulation.md, docs/05-conventions/csharp-style.md, shared/README.md]
        refs: [ADR-0005]
        depends_on: [ST-02.2.1]
      - id: ST-05.1.2
        title: Fixed64 type and math library
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a simulation developer, I want a Q32.32 fixed-point type with operators and core functions, so that
          all rule arithmetic is bit-exact on every platform.
        acceptance_criteria:
          - Fixed64 supports +, -, *, / with documented rounding, comparisons, conversion from integers and rational literals, and saturating overflow behaviour.
          - Sqrt, Min, Max, Clamp, Abs and Lerp are implemented without floating point.
          - Property tests compare results against a decimal reference within one ULP for random inputs.
          - Benchmarks for multiply and divide are recorded in agent_notes.
        docs: [docs/03-architecture/simulation.md, docs/adr/0005-shared-deterministic-simulation.md]
        refs: [SIM-020]
        depends_on: [ST-05.1.1]
      - id: ST-05.1.3
        title: Determinism analyzers
        type: feature
        status: ready
        priority: P0
        size: S
        story: >
          As a reviewer, I want the compiler to reject nondeterministic APIs in the simulation, so that desyncs
          are prevented rather than debugged.
        acceptance_criteria:
          - A Roslyn analyzer (or BannedApiAnalyzers config) errors on float, double, decimal math, System.Random, DateTime.Now, Guid.NewGuid, Dictionary and HashSet enumeration, threading and I/O in WarRoom.Simulation.
          - Each diagnostic message cites the SIM rule ID.
          - A test project proves each banned usage fails to compile.
        docs: [docs/03-architecture/simulation.md, docs/adr/0005-shared-deterministic-simulation.md]
        refs: [SIM-020, SIM-021, SIM-022, SIM-023]
        depends_on: [ST-05.1.1]
      - id: ST-05.1.4
        title: PCG32 deterministic random
        type: feature
        status: ready
        priority: P0
        size: S
        story: >
          As a simulation developer, I want a seeded random source derived from the match seed and step index,
          so that randomness is reproducible in replays.
        acceptance_criteria:
          - IDeterministicRandom with a PCG32 implementation; streams derive from (match seed, step index, stream id).
          - Known-answer tests match the PCG reference outputs.
          - Range and Fixed64 helpers avoid modulo bias.
        docs: [docs/03-architecture/simulation.md]
        refs: [SIM-021]
        depends_on: [ST-05.1.2]
      - id: ST-05.1.5
        title: Fixed-point sphere math
        type: feature
        status: ready
        priority: P1
        size: M
        story: >
          As a simulation developer, I want deterministic trig and geodesic helpers, so that previews and any
          runtime distance maths match between client and server.
        acceptance_criteria:
          - Sin, Cos, Atan2 via lookup tables or CORDIC with documented error bounds.
          - Great-circle distance between lat/lon points in Fixed64 matches a double reference within the documented bound.
          - Tables are generated by a script and checked in with a hash test.
        docs: [docs/03-architecture/simulation.md]
        refs: [SIM-024, GDD-MAP-008]
        depends_on: [ST-05.1.2]
  - id: FE-05.2
    title: State, commands and scheduling
    summary: Match state with canonical hashing, the validate/apply pipeline, scheduler and events.
    stories:
      - id: ST-05.2.1
        title: MatchState with canonical serialization and hash
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a developer debugging desyncs, I want a canonical serialization and xxHash64 state hash, so that two
          states can be compared cheaply and divergence located.
        acceptance_criteria:
          - MatchState holds nations, provinces, armies, scheduled events and clock in ID-sorted collections.
          - Canonical binary serialization round-trips; ComputeHash uses xxHash64 over it.
          - Golden test - a fixed state has a fixed hash committed in the repo.
        docs: [docs/03-architecture/simulation.md]
        refs: [SIM-001, SIM-006, SIM-022]
        depends_on: [ST-05.1.2]
      - id: ST-05.2.2
        title: Command validation and apply pipeline
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a server developer, I want every command validated without side effects before it is applied, so that
          invalid or malicious commands never change state.
        acceptance_criteria:
          - ICommand handlers expose Validate(state, nationId, command) returning a typed Result with error codes, and Apply.
          - Given a command for a unit the nation does not own, when validated, then it is rejected with a stable error code and state is unchanged.
          - Errors map to protocol error codes listed in api-and-contracts.md.
        docs: [docs/03-architecture/simulation.md, docs/05-conventions/api-and-contracts.md]
        refs: [SIM-003]
        depends_on: [ST-05.2.1]
      - id: ST-05.2.3
        title: Event scheduler
        type: feature
        status: ready
        priority: P0
        size: S
        story: >
          As a simulation developer, I want a deterministic priority queue of scheduled events, so that ticks,
          arrivals and combat rounds fire in a reproducible order.
        acceptance_criteria:
          - Events are ordered by (GameTime, Priority, Sequence) with a monotonic sequence counter in state.
          - Step(state, until) processes all events up to a time and returns the next wake-up time.
          - Property test - inserting the same events in any order produces the same processing order.
        docs: [docs/03-architecture/simulation.md]
        refs: [SIM-005, SIM-010, SIM-015]
        depends_on: [ST-05.2.1]
      - id: ST-05.2.4
        title: SimEvent emission
        type: feature
        status: ready
        priority: P1
        size: S
        story: >
          As a client and analytics consumer, I want every state change described by a typed SimEvent, so that UI,
          notifications and telemetry react to changes without diffing state.
        acceptance_criteria:
          - Step returns the list of SimEvents produced, in order, each tagged with the nations allowed to see it.
          - Events are versioned records with stable names that map to wr.<domain>.<verb> telemetry where relevant.
        docs: [docs/03-architecture/simulation.md, docs/03-architecture/observability-and-analytics.md]
        refs: [SIM-004]
        depends_on: [ST-05.2.3]
  - id: FE-05.3
    title: Map graph and movement
    summary: Content loading, province graph, pathfinding and the move command.
    refs: [GDD-MIL-001, GDD-MAP-004, SIM-011]
    stories:
      - id: ST-05.3.1
        title: Content and province graph loading
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a simulation developer, I want map and unit content loaded into immutable ID-sorted arrays, so that
          rules read content quickly and identically everywhere.
        acceptance_criteria:
          - A loader builds the province graph (adjacency, edge distances, terrain) and unit definitions from validated content.
          - Content is pinned per match by pack_id@version.
          - Loading the same content twice yields the same content hash.
        docs: [docs/03-architecture/simulation.md, docs/02-game-design/content-model.md]
        refs: [SIM-025, GDD-CONT-003]
        depends_on: [ST-05.2.1, ST-10.3.2]
      - id: ST-05.3.2
        title: Pathfinding on the province graph
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a player, I want armies to take the fastest legal path, so that movement orders behave predictably.
        acceptance_criteria:
          - A* over the province graph using travel time (distance, terrain, roads, unit speed) with deterministic tie-breaking by province ID.
          - Impassable or hostile-blocked provinces respect diplomacy state (right of passage).
          - Benchmark - 95th percentile path on the 64-player map under 1 ms on server hardware.
        docs: [docs/02-game-design/military-and-combat.md, docs/02-game-design/map-and-territory.md]
        refs: [GDD-MIL-001, GDD-MAP-003, GDD-MAP-004]
        depends_on: [ST-05.3.1]
      - id: ST-05.3.3
        title: Move command and arrival events
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a player, I want to order an army to a province and see it arrive at the predicted time, so that I can
          plan check-ins around arrivals.
        acceptance_criteria:
          - MoveArmy validates ownership and reachability, computes the path and schedules ArmyArrives per segment.
          - Given speed 4x, when an army moves, then real-time arrival equals game time divided by 4.
          - Cancelling or redirecting mid-path removes pending arrivals deterministically.
        docs: [docs/03-architecture/simulation.md, docs/02-game-design/military-and-combat.md]
        refs: [SIM-011, GDD-MIL-001, GDD-LOOP-006]
        depends_on: [ST-05.3.2, ST-05.2.3]
  - id: FE-05.4
    title: Ticks
    summary: Economy, daily and combat-round scheduling skeletons that gameplay epics fill in.
    milestone: M2
    stories:
      - id: ST-05.4.1
        title: Economy tick skeleton
        type: feature
        status: draft
        priority: P1
        size: S
        story: >
          As a gameplay developer, I want an hourly economy tick with ordered system hooks, so that economy rules
          plug in without touching the scheduler.
        acceptance_criteria:
          - EconomyTick fires every game hour and calls registered systems in a fixed order.
        docs: [docs/03-architecture/simulation.md]
        refs: [SIM-012]
        depends_on: [ST-05.2.3]
      - id: ST-05.4.2
        title: Daily tick skeleton
        type: feature
        status: draft
        priority: P1
        size: S
        story: >
          As a gameplay developer, I want a daily tick at game midnight, so that day-gating, VP and AI planning run
          at a predictable moment.
        acceptance_criteria:
          - DailyTick fires at game midnight with ordered hooks and increments the match day.
        docs: [docs/03-architecture/simulation.md]
        refs: [SIM-014]
        depends_on: [ST-05.2.3]
      - id: ST-05.4.3
        title: Combat round scheduling
        type: feature
        status: draft
        priority: P1
        size: S
        story: >
          As a gameplay developer, I want engagements to schedule rounds every 15 game minutes until resolved, so that
          combat rules have a deterministic driver.
        acceptance_criteria:
          - Engagement start schedules rounds; resolution cancels further rounds.
        docs: [docs/03-architecture/simulation.md, docs/02-game-design/military-and-combat.md]
        refs: [SIM-013, GDD-MIL-011]
        depends_on: [ST-05.2.3]
  - id: FE-05.5
    title: Per-nation views
    summary: Projection of state to what each nation may see.
    stories:
      - id: ST-05.5.1
        title: Nation view projection
        type: feature
        status: ready
        priority: P0
        size: M
        story: >
          As a server developer, I want a function that projects MatchState to a nation's visible view, so that
          hidden state is never serialized to a client.
        acceptance_criteria:
          - NationView(state, nationId) includes only own entities and entities within vision; others appear as last-known or absent.
          - Property test - for random states, no entity outside vision appears in the view.
          - Views are deterministic and hashable for client reconciliation.
        docs: [docs/02-game-design/intel-and-fog-of-war.md, docs/03-architecture/security-and-anti-cheat.md]
        refs: [GDD-INT-001, GDD-INT-002, GDD-INT-003, NFR-SEC-001]
        depends_on: [ST-05.2.1]
  - id: FE-05.6
    title: Simulation test harness
    summary: Golden replays, rule coverage, property tests and cross-runtime determinism.
    docs: [docs/05-conventions/testing.md]
    stories:
      - id: ST-05.6.1
        title: Golden replay harness
        type: test
        status: ready
        priority: P0
        size: M
        story: >
          As a developer, I want recorded command logs replayed with expected hashes, so that any behaviour change
          is visible and intentional.
        acceptance_criteria:
          - Replay files (seed, content hash, commands with timestamps, expected hashes at checkpoints) live in shared/simulation/tests/golden.
          - A tool regenerates goldens only with an explicit flag and a reason recorded in the commit message.
          - A mismatch reports the first divergent step and a state diff.
        docs: [docs/03-architecture/simulation.md, docs/05-conventions/testing.md]
        refs: [SIM-006]
        depends_on: [ST-05.2.3, ST-05.3.3]
      - id: ST-05.6.2
        title: GDD rule coverage report
        type: test
        status: ready
        priority: P2
        size: S
        story: >
          As the project owner, I want a report of which GDD and SIM rule IDs have tests, so that I can see what
          rules are unverified.
        acceptance_criteria:
          - A tool scans test traits for rule IDs and compares them with IDs defined in docs/.
          - The report lists untested rules per GDD area and is published as a CI artifact.
        docs: [docs/05-conventions/testing.md]
        depends_on: [ST-05.6.1]
      - id: ST-05.6.3
        title: Property-based tests for core invariants
        type: test
        status: ready
        priority: P1
        size: S
        story: >
          As a developer, I want generated scenarios checking invariants, so that edge cases are explored beyond
          hand-written tests.
        acceptance_criteria:
          - FsCheck or CsCheck tests assert invariants - no negative strength, every province has exactly one owner, scheduler time never decreases.
        docs: [docs/05-conventions/testing.md]
        refs: [GDD-MAP-001]
        depends_on: [ST-05.3.3]
      - id: ST-05.6.4
        title: Cross-runtime determinism check
        type: test
        status: ready
        priority: P0
        size: M
        story: >
          As a developer, I want the golden replays run inside a Unity IL2CPP player build in CI, so that client
          prediction is proven to match the server.
        acceptance_criteria:
          - A headless Unity player build runs the golden replays and writes hashes.
          - CI compares them with the .NET hashes and fails on any difference.
        docs: [docs/03-architecture/simulation.md, docs/06-environments/ci-cd.md]
        refs: [SIM-002, RISK-002, RISK-003]
        depends_on: [ST-05.6.1, ST-04.2.1]
